name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # No pyspark/kafka here: tests stub Spark and cover pure-Python logic.
        run: pip install pytest pandas numpy pyyaml pyarrow streamlit plotly

      - name: Run tests
        run: pytest -v
