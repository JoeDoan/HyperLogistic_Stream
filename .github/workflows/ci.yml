name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main, "feat/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # pyspark 3.5 imports distutils, removed in Python 3.12

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install test dependencies
        # pyspark runs the repeat-safe (dedupe) tests; no Kafka needed.
        run: pip install pytest pandas numpy pyyaml pyarrow streamlit plotly pyspark==3.5.1

      - name: Run tests
        run: pytest -v
